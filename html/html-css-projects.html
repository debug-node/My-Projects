<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>UI/UX Designs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="min-h-screen flex flex-col">
    <div class="flex-1">
      <!-- Header -->
      <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-purple-400/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
          <div class="flex items-center justify-between">
            <button onclick="go('../index.html')"
              class="flex items-center gap-2 text-purple-300 hover:text-white transition-all duration-300 group">
              <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
              <span class="font-semibold">Back</span>
            </button>

            <h1 class="text-xl sm:text-2xl font-bold text-white">
              UI/UX <span class="text-purple-400">Designs</span>
            </h1>

            <div class="w-20"></div>
          </div>
        </div>
      </header>

      <!-- Search Bar -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <input type="text" id="search" placeholder="🔍 Search projects..." onkeyup="searchProjects()"
          class="w-full max-w-2xl mx-auto block px-6 py-3 bg-white/10 backdrop-blur-lg border border-purple-400/30 rounded-2xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-300" />
      </div>

      <!-- Projects Grid -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <div id="projects" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-fr">
        </div>
      </div>

      <script src="../script.js"></script>

      <script>
        async function init() {
          const res = await fetch('/data/html-css-projects.json');
          const projects = await res.json();
          renderProjects(projects);
        }

        document.addEventListener('DOMContentLoaded', init);
      </script>
    </div>

    <!-- Footer -->
    <footer class="bg-black/30 backdrop-blur-lg border-t border-purple-400/20 py-6 mt-16">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          <p class="text-gray-300 text-center sm:text-left text-base">
            © 2026 <span class="text-purple-500 font-semibold">Aditya Kumar</span> | Built with <span
              class="text-red-500 animate-pulse">💙</span>
          </p>

          <div class="flex gap-4">
            <a href="https://github.com/debug-node" target="_blank"
              class="text-gray-400 hover:text-white transform hover:scale-125 transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(147,51,234,0.7)]"
              aria-label="GitHub">
              <i class="fa-brands fa-github text-2xl"></i>
            </a>

            <a href="https://www.linkedin.com/in/aditya-kumar-0215942b3/" target="_blank"
              class="text-gray-400 hover:text-blue-400 transform hover:scale-125 transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(59,130,246,0.7)]"
              aria-label="LinkedIn">
              <i class="fa-brands fa-linkedin text-2xl"></i>
            </a>
          </div>
        </div>
      </div>
    </footer>
  </div>
</body>

</html>
