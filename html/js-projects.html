<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>JS Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-purple-400/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center justify-between">
        <button onclick="go('../index.html')"
          class="flex items-center gap-2 text-purple-300 hover:text-white transition-all duration-300 group">
          <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
          <span class="font-semibold">Back</span>
        </button>

        <h1 class="text-xl sm:text-2xl font-bold text-white">
          JavaScript <span class="text-purple-400">Projects</span>
        </h1>

        <div class="w-20"></div>
      </div>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <input type="text" id="search" placeholder="🔍 Search projects..." onkeyup="searchProjects()"
      class="w-full max-w-2xl mx-auto block px-6 py-3 bg-white/10 backdrop-blur-lg border border-purple-400/30 rounded-2xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-300" />
  </div>

    <div id="projects" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-fr"></div>

        title: "Color Box",
