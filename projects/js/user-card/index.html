<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen flex-col items-center justify-center bg-neutral-900 text-white">
    <div class="users grid w-full max-w-5xl grid-cols-1 justify-items-center gap-4 p-6 sm:grid-cols-2 lg:grid-cols-3"></div>

    <button type="button" id="refreshBtn"
        class="mt-2 mb-6 flex items-center gap-2 rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold shadow-md transition hover:bg-blue-500 active:scale-95"
        aria-label="Refresh users">
        <span aria-hidden="true">↻</span>
        Refresh
    </button>

    <script src="script.js"></script>
</body>

</html>
