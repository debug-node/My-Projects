<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-neutral-900">

    <div class="w-full max-w-md rounded-xl border border-neutral-700 bg-neutral-800 p-8 shadow-xl">

        <h1 class="mb-6 text-center text-2xl font-bold text-white">Sign Up</h1>

        <form id="signupForm">

            <div class="mb-4">
                <label for="name" class="mb-1.5 block text-sm font-medium text-neutral-300">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"
                    class="w-full rounded-lg bg-neutral-700 px-4 py-2.5 text-sm text-white placeholder-neutral-500 outline-none ring-1 ring-neutral-600 transition focus:ring-2 focus:ring-blue-500" />
                <p id="nameError" class="mt-1 hidden text-xs text-red-400">Name is required.</p>
            </div>

            <div class="mb-4">
                <label for="email" class="mb-1.5 block text-sm font-medium text-neutral-300">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                    class="w-full rounded-lg bg-neutral-700 px-4 py-2.5 text-sm text-white placeholder-neutral-500 outline-none ring-1 ring-neutral-600 transition focus:ring-2 focus:ring-blue-500" />
                <p id="emailError" class="mt-1 hidden text-xs text-red-400">Valid email is required.</p>
            </div>

            <div class="mb-6">
                <label for="password" class="mb-1.5 block text-sm font-medium text-neutral-300">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"
                    class="w-full rounded-lg bg-neutral-700 px-4 py-2.5 text-sm text-white placeholder-neutral-500 outline-none ring-1 ring-neutral-600 transition focus:ring-2 focus:ring-blue-500" />
                <p id="passwordError" class="mt-1 hidden text-xs text-red-400">Password must be at least 6 characters.
                </p>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60">
                Submit
            </button>

            <p id="successMsg" class="mt-4 hidden text-center text-sm text-emerald-400">✓ Form submitted successfully!</p>

        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
