<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Das Grüne — Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>
        <div class="header" id="head">
            <header class="header-content">
                <a href="#logo" class="logo">
                    <span class="logo-text">Das Grüne</span>
                </a>

                <nav class="nav">
                    <a href="#about" class="nav-link">About Us</a>
                    <a href="#project" class="nav-link">Project</a>
                    <a href="#services" class="nav-link">Services</a>
                    <a href="#contact" class="nav-link">Let's Talk</a>
                </nav>
            </header>
        </div>

        <section class="hero">
            <div class="hero-text1">
                <h1>D̈IGITIZE</h1>
                <div class="right">
                    <div class="video">
                        <div class="play-btn">
                            <div class="triangle"></div>
                        </div>
                    </div>
                    <div class="stars">✦ ✦ ✦</div>
                </div>
            </div>
            <div class="hero-text2">
                <h1>IDEAS</h1>
                <p>
                    The art of visual communication,creatively impacting the world
                    around us—one good design at a time, design like you mean it !
                </p>
            </div>
        </section>

        <section>
            <div class="data">
                <div class="data-text1">
                    <i class="fa-solid fa-crown"></i>
                    2026 Best Agency
                </div>
                <div class="data-text2">
                    <i class="fa-solid fa-globe"></i>
                    World Class Agency
                </div>
                <div class="line"></div>
                <div class="circles">
                    <span class="circle1"></span>
                    <span class="circle2"></span>
                    <span class="circle3"></span>
                </div>
            </div>
        </section>

        <section>
            <div class="card">
                <div class="arrow">
                    <i class="ri-arrow-right-up-line"></i>
                </div>
            </div>
        </section>

        <section>
            <div class="text">
                discuss your Ideas <span>✦</span> discuss your Ideas
            </div>
        </section>
    </main>
</body>

</html>
